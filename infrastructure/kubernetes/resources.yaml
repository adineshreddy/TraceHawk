apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring
  namespace: tracehawk
data:
  prometheus.yml: "global:\n  scrape_interval: 5s\n  scrape_timeout: 3s\nscrape_configs:\n\
    \  - job_name: tracehawk\n    static_configs:\n      - targets: ['detector:9100',\
    \ 'detector-b:9100', 'publisher:9100', 'collector:9100']\n"
  datasources.yml: "apiVersion: 1\ndatasources:\n  - name: TraceHawk Prometheus\n\
    \    uid: tracehawk-prometheus\n    type: prometheus\n    access: proxy\n    url:\
    \ http://prometheus:9090\n    isDefault: true\n    editable: false\n"
  dashboards.yml: "apiVersion: 1\nproviders:\n  - name: TraceHawk\n    folder: TraceHawk\n\
    \    type: file\n    disableDeletion: true\n    editable: false\n    options:\n\
    \      path: /var/lib/grafana/dashboards\n"
  operations.json: "{\n  \"uid\": \"tracehawk-operations\",\n  \"title\": \"TraceHawk\
    \ Operations\",\n  \"schemaVersion\": 41,\n  \"version\": 1,\n  \"refresh\": \"\
    5s\",\n  \"time\": {\n    \"from\": \"now-15m\",\n    \"to\": \"now\"\n  },\n\
    \  \"tags\": [\n    \"tracehawk\",\n    \"replay\"\n  ],\n  \"panels\": [\n  \
    \  {\n      \"id\": 1,\n      \"title\": \"Pipeline readiness\",\n      \"type\"\
    : \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n    \
    \    \"uid\": \"tracehawk-prometheus\"\n      },\n      \"gridPos\": {\n     \
    \   \"x\": 0,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n     \
    \ },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n         \
    \ \"expr\": \"tracehawk_pipeline_ready\",\n          \"legendFormat\": \"{{instance}}\
    \ {{__name__}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"\
    title\": \"Worker readiness\",\n      \"type\": \"stat\",\n      \"datasource\"\
    : {\n        \"type\": \"prometheus\",\n        \"uid\": \"tracehawk-prometheus\"\
    \n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 0,\n    \
    \    \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n\
    \          \"refId\": \"A\",\n          \"expr\": \"tracehawk_worker_ready\",\n\
    \          \"legendFormat\": \"{{instance}} {{__name__}}\"\n        }\n      ]\n\
    \    },\n    {\n      \"id\": 3,\n      \"title\": \"Assigned partitions\",\n\
    \      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\"\
    ,\n        \"uid\": \"tracehawk-prometheus\"\n      },\n      \"gridPos\": {\n\
    \        \"x\": 0,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n\
    \      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n    \
    \      \"expr\": \"tracehawk_assigned_partitions\",\n          \"legendFormat\"\
    : \"{{instance}} {{__name__}}\"\n        }\n      ]\n    },\n    {\n      \"id\"\
    : 4,\n      \"title\": \"Event lag by worker\",\n      \"type\": \"timeseries\"\
    ,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\"\
    : \"tracehawk-prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n\
    \        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\"\
    : [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"tracehawk_partition_lag\"\
    ,\n          \"legendFormat\": \"{{instance}} {{__name__}}\"\n        }\n    \
    \  ]\n    },\n    {\n      \"id\": 5,\n      \"title\": \"Processed records /\
    \ second\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n      \
    \  \"type\": \"prometheus\",\n        \"uid\": \"tracehawk-prometheus\"\n    \
    \  },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 16,\n        \"\
    w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n      \
    \    \"refId\": \"A\",\n          \"expr\": \"rate(tracehawk_processed_records_total[1m])\"\
    ,\n          \"legendFormat\": \"{{instance}} {{__name__}}\"\n        }\n    \
    \  ]\n    },\n    {\n      \"id\": 6,\n      \"title\": \"Pending alert updates\"\
    ,\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\"\
    : \"prometheus\",\n        \"uid\": \"tracehawk-prometheus\"\n      },\n     \
    \ \"gridPos\": {\n        \"x\": 12,\n        \"y\": 16,\n        \"w\": 12,\n\
    \        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"refId\"\
    : \"A\",\n          \"expr\": \"tracehawk_pending_alert_updates\",\n         \
    \ \"legendFormat\": \"{{instance}} {{__name__}}\"\n        }\n      ]\n    },\n\
    \    {\n      \"id\": 7,\n      \"title\": \"Quarantine pending delivery / review\"\
    ,\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\"\
    : \"prometheus\",\n        \"uid\": \"tracehawk-prometheus\"\n      },\n     \
    \ \"gridPos\": {\n        \"x\": 0,\n        \"y\": 24,\n        \"w\": 12,\n\
    \        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"refId\"\
    : \"A\",\n          \"expr\": \"{__name__=~\\\"tracehawk_pending_deadletters|tracehawk_unreviewed_deadletters\\\
    \"}\",\n          \"legendFormat\": \"{{instance}} {{__name__}}\"\n        }\n\
    \      ]\n    },\n    {\n      \"id\": 8,\n      \"title\": \"Recovery and delivery\
    \ errors\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n      \
    \  \"type\": \"prometheus\",\n        \"uid\": \"tracehawk-prometheus\"\n    \
    \  },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 24,\n        \"\
    w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n      \
    \    \"refId\": \"A\",\n          \"expr\": \"{__name__=~\\\"tracehawk_recovery_errors_total|tracehawk_delivery_errors_total\\\
    \"}\",\n          \"legendFormat\": \"{{instance}} {{__name__}}\"\n        }\n\
    \      ]\n    },\n    {\n      \"id\": 9,\n      \"title\": \"Consumer assignments\"\
    ,\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\"\
    : \"prometheus\",\n        \"uid\": \"tracehawk-prometheus\"\n      },\n     \
    \ \"gridPos\": {\n        \"x\": 0,\n        \"y\": 32,\n        \"w\": 12,\n\
    \        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"refId\"\
    : \"A\",\n          \"expr\": \"tracehawk_rebalances_total\",\n          \"legendFormat\"\
    : \"{{instance}} {{__name__}}\"\n        }\n      ]\n    },\n    {\n      \"id\"\
    : 10,\n      \"title\": \"Delivered alert updates / second\",\n      \"type\"\
    : \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n\
    \        \"uid\": \"tracehawk-prometheus\"\n      },\n      \"gridPos\": {\n \
    \       \"x\": 12,\n        \"y\": 32,\n        \"w\": 12,\n        \"h\": 8\n\
    \      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n    \
    \      \"expr\": \"rate(tracehawk_delivered_alert_updates_total[1m])\",\n    \
    \      \"legendFormat\": \"{{instance}} {{__name__}}\"\n        }\n      ]\n \
    \   }\n  ]\n}"
