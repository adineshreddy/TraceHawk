---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tracehawk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: tracehawk
    spec:
      serviceAccountName: workload
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        imagePullPolicy: Never
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 384Mi
            cpu: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: POSTGRES_DB
          value: tracehawk
        - name: POSTGRES_USER
          value: tracehawk
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: runtime-secrets
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: temp
          mountPath: /tmp
        - name: database
          mountPath: /var/lib/postgresql/data
        - name: pg-socket
          mountPath: /var/run/postgresql
        readinessProbe: &id001
          exec: &id002
            command:
            - pg_isready
            - -U
            - tracehawk
            - -d
            - tracehawk
          periodSeconds: 10
          timeoutSeconds: 8
          failureThreshold: 3
        livenessProbe: *id001
        startupProbe:
          exec: *id002
          periodSeconds: 10
          timeoutSeconds: 8
          failureThreshold: 60
      volumes:
      - name: temp
        emptyDir:
          sizeLimit: 64Mi
      - name: database
        persistentVolumeClaim:
          claimName: database
      - name: pg-socket
        emptyDir:
          sizeLimit: 16Mi
  serviceName: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tracehawk
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: tracehawk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/part-of: tracehawk
    spec:
      serviceAccountName: workload
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kafka
        image: apache/kafka:4.3.0@sha256:0be4c9eb3565733612d2836d65636fd611a219ebcf5b4162e5ac259ea0ecb907
        imagePullPolicy: Never
        resources:
          requests:
            memory: 384Mi
            cpu: 250m
          limits:
            memory: 768Mi
            cpu: '2'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: KAFKA_NODE_ID
          value: '1'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092,CONTROLLER://:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka:9092
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@kafka:9093
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: PLAINTEXT
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: '0'
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: 'false'
        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data
        - name: KAFKA_HEAP_OPTS
          value: -Xms128m -Xmx384m
        - name: CLUSTER_ID
          value: MkU3OEVBNTcwNTJENDM2Qk
        - name: LOG_DIR
          value: /tmp/kafka-logs
        - name: KAFKA_GC_LOG_OPTS
          value: -Xlog:gc*:stdout:time
        ports:
        - containerPort: 9092
        volumeMounts:
        - name: temp
          mountPath: /tmp
        - name: broker
          mountPath: /var/lib/kafka/data
        - name: kafka-config
          mountPath: /opt/kafka/config
        readinessProbe:
          exec:
            command:
            - /opt/kafka/bin/kafka-topics.sh
            - --bootstrap-server
            - kafka:9092
            - --list
          periodSeconds: 10
          timeoutSeconds: 8
          failureThreshold: 3
        livenessProbe:
          exec: &id001
            command:
            - bash
            - -c
            - kill -0 1
          periodSeconds: 10
          timeoutSeconds: 8
          failureThreshold: 3
        startupProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 8
          failureThreshold: 60
      volumes:
      - name: temp
        emptyDir:
          sizeLimit: 64Mi
      - name: broker
        persistentVolumeClaim:
          claimName: broker
      - name: kafka-config
        emptyDir:
          sizeLimit: 16Mi
  serviceName: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: tracehawk
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
  - name: broker
    port: 9092
    targetPort: 9092
  - name: controller
    port: 9093
    targetPort: 9093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tracehawk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: tracehawk
    spec:
      serviceAccountName: workload
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: tracehawk-backend:phase4
        imagePullPolicy: Never
        resources:
          requests:
            memory: 96Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: runtime-secrets
              key: POSTGRES_PASSWORD
        - name: INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: runtime-secrets
              key: INTERNAL_TOKEN
        - name: OPERATOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: runtime-secrets
              key: OPERATOR_PASSWORD
        - name: ANALYST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: runtime-secrets
              key: ANALYST_PASSWORD
        ports:
        - containerPort: 8100
        volumeMounts:
        - name: temp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8100
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: &id001
            path: /health/live
            port: 8100
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        envFrom:
        - configMapRef:
            name: runtime
      volumes:
      - name: temp
        emptyDir:
          sizeLimit: 64Mi
      initContainers:
      - name: wait-database
        image: tracehawk-backend:phase4
        imagePullPolicy: Never
        command:
        - python
        - -c
        - "import time;from tracehawk.core import db\nwhile True:\n try:\n  c=db();c.close();break\n\
          \ except Exception:time.sleep(1)"
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: runtime-secrets
              key: POSTGRES_PASSWORD
        envFrom:
        - configMapRef:
            name: runtime
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 500m
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tracehawk
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
  - port: 8100
    targetPort: 8100
---
apiVersion: batch/v1
kind: Job
metadata:
  name: topics
  namespace: tracehawk
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: topics
    spec:
      serviceAccountName: workload
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: topics
        image: apache/kafka:4.3.0@sha256:0be4c9eb3565733612d2836d65636fd611a219ebcf5b4162e5ac259ea0ecb907
        imagePullPolicy: Never
        command:
        - /bin/sh
        - -c
        args:
        - until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
          >/dev/null 2>&1; do sleep 3; done; for topic in tracehawk.events.v1 tracehawk.alerts.v1
          tracehawk.deadletters.v1; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server
          kafka:9092 --create --if-not-exists --topic $topic --partitions 3 --replication-factor
          1 --config retention.ms=86400000 --config retention.bytes=268435456 || exit
          1; done
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 384Mi
            cpu: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: temp
          mountPath: /tmp
      volumes:
      - name: temp
        emptyDir:
          sizeLimit: 64Mi
---
