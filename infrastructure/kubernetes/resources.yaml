---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: tracehawk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
        app.kubernetes.io/part-of: tracehawk
    spec:
      serviceAccountName: workload
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: collector
        image: tracehawk-collector:phase4
        imagePullPolicy: Never
        resources:
          requests:
            memory: 32Mi
            cpu: 100m
          limits:
            memory: 128Mi
            cpu: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: runtime-secrets
              key: INTERNAL_TOKEN
        ports:
        - containerPort: 9100
        volumeMounts:
        - name: temp
          mountPath: /tmp
        - name: collector-state
          mountPath: /state
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9100
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: &id001
            path: /health/live
            port: 9100
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
      volumes:
      - name: temp
        emptyDir:
          sizeLimit: 64Mi
      - name: collector-state
        persistentVolumeClaim:
          claimName: collector-state
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: tracehawk
spec:
  type: ClusterIP
  selector:
    app: collector
  ports:
  - port: 9100
    targetPort: 9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: tracehawk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
        app.kubernetes.io/part-of: tracehawk
    spec:
      serviceAccountName: workload
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: console
        image: tracehawk-console:phase6
        imagePullPolicy: Never
        resources:
          requests:
            memory: 48Mi
            cpu: 100m
          limits:
            memory: 128Mi
            cpu: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: GRAFANA_URL
          value: http://127.0.0.1:3103/d/tracehawk-operations
        ports:
        - containerPort: 3100
        volumeMounts:
        - name: temp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /health/live
            port: 3100
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: &id001
            path: /health/live
            port: 3100
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
      volumes:
      - name: temp
        emptyDir:
          sizeLimit: 64Mi
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: tracehawk
spec:
  type: ClusterIP
  selector:
    app: console
  ports:
  - port: 3100
    targetPort: 3100
