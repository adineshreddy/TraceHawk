apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: tracehawk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/part-of: tracehawk
    spec:
      serviceAccountName: workload
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
        imagePullPolicy: Never
        resources:
          requests:
            memory: 64Mi
            cpu: 100m
          limits:
            memory: 192Mi
            cpu: 500m
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env: []
        command:
        - /bin/prometheus
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.retention.time=24h
        - --storage.tsdb.retention.size=128MB
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: temp
          mountPath: /tmp
        - name: metrics
          mountPath: /prometheus
        - name: config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
          readOnly: true
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: &id001
            path: /-/healthy
            port: 9090
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
      volumes:
      - name: temp
        emptyDir:
          sizeLimit: 64Mi
      - name: metrics
        persistentVolumeClaim:
          claimName: metrics
      - name: config
        configMap:
          name: monitoring
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: tracehawk
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tracehawk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/part-of: tracehawk
    spec:
      serviceAccountName: workload
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
        imagePullPolicy: Never
        resources:
          requests:
            memory: 96Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: operator
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        - name: GF_PLUGINS_PREINSTALL_DISABLED
          value: 'true'
        - name: GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED
          value: 'true'
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: runtime-secrets
              key: OPERATOR_PASSWORD
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: temp
          mountPath: /tmp
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/tracehawk.yml
          subPath: datasources.yml
          readOnly: true
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/tracehawk.yml
          subPath: dashboards.yml
          readOnly: true
        - name: config
          mountPath: /var/lib/grafana/dashboards/operations.json
          subPath: operations.json
          readOnly: true
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: &id001
            path: /api/health
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
      volumes:
      - name: temp
        emptyDir:
          sizeLimit: 64Mi
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: config
        configMap:
          name: monitoring
  strategy:
    type: Recreate
---
