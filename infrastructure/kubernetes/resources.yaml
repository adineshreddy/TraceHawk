apiVersion: v1
kind: Namespace
metadata:
  name: tracehawk
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload
  namespace: tracehawk
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime
  namespace: tracehawk
data:
  DB_HOST: postgres
  KAFKA_BROKERS: kafka:9092
  PUBLIC_ORIGIN: http://127.0.0.1:3102
  PYTHONDONTWRITEBYTECODE: '1'
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tracehawk-database
  labels:
    app.kubernetes.io/part-of: tracehawk
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: tracehawk-local
  hostPath:
    path: /tracehawk-data/database
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - tracehawk-control-plane
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database
  namespace: tracehawk
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: tracehawk-local
  volumeName: tracehawk-database
